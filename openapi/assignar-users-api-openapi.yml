      operationId: getUserInductions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/UserInductions'
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
          default: ''
  /users/{userId}/inductions/{inductionId}:
    get:
      summary: Retrieve an existing user induction
      tags:
      - Users
      operationId: 33c12c85-182e-44a0-be41-fc42232dcea2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/UserInduction'
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
          default: ''
      - name: inductionId
        required: true
        in: path
        schema:
          type: string
          default: ''
    put:
      summary: Update an existing user induction
      tags:
      - Users
      operationId: updateUserInduction
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
          default: ''
      - name: inductionId
        required: true
        in: path
        schema:
          type: string
          default: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInductionUpdateCreate'
      responses:
        '204':
          description: Success
    post:
      summary: Create a new user induction
      tags:
      - Users
      operationId: createUserInduction
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
          default: ''
      - name: inductionId
        required: true
        in: path
        schema:
          type: string
          default: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInductionUpdateCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/UserInductionUpdateCreate'
  /users/{userId}/inductions/{id}:
    delete:
      summary: Delete an existing user induction
      tags:
      - Users
      operationId: deleteUserInduction
      responses:
        '204':
          description: Success
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
          default: ''
      - name: id
        required: true
        in: path
        schema:
          type: string
          default: ''
  /users/{userId}/competencies:
    get:
      summary: List all existing user competencies for user
      tags:
      - Users
      operationId: getUserCompetencies
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/UserCompetencies'
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
          default: ''
  /users/{userId}/competencies/{competencyId}:
    get:
      summary: User Competencies
      tags:
      - Users
      operationId: c3d92879-778a-4af1-bb5f-87938babf2dc
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/UserCompetencies'
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
          default: ''
      - name: competencyId
        required: true
