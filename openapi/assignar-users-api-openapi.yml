  /upload-urls/user-competency:
    post:
      summary: Calculate an S3 signed URL for uploading a file for a user competency
      description: 'We store file uploads to Amazon S3. Use this endpoint to receive a secure, signed `url` to upload a file to and

        the `path` to that file that you can use in the payload for creating the User Competency.'
      tags:
      - Users
      operationId: postUserCompetencyUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                  required: true
                  description: The filename of the file you wish to upload.
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: url
                    description: To upload the file, use PUT with this URL.
                  path:
                    type: string
                    description: Use this value as `attachment` in your payload when creating a User Competency.
components:
  schemas:
    UserSkills:
      type: array
      items:
        $ref: '#/components/schemas/UserSkill'
    UserTypes:
      type: array
      items:
        $ref: '#/components/schemas/UserType'
    EmploymentType:
      type: object
      required:
      - name
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
    UserInductionUpdateCreate:
      type: object
      required:
      - induction_id
      - user_id
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
        induction_id:
          type: integer
        active:
          type: boolean
        description:
          type: string
        created_time:
          type: string
          readOnly: true
        issue_date:
          type: string
        expiry_time:
          type: string
        attachment:
          type: string
    UserInductions:
      type: array
      items:
        $ref: '#/components/schemas/UserInduction'
    UserSkill:
      type: object
      required:
      - skill_id
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
        skill_id:
          type: integer
        created_time:
          type: string
        skill:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
    TagPart:
      title: TagPart
      x-stoplight:
        id: epsk9hslhfq0q
      type: object
      description: ''
      properties:
        tag_id:
          type: integer
          description: Identifier of the tag
          example: 301
        name:
          type: string
          description: Name of the tag
        description:
          type:
          - string
          - 'null'
          description: Description of the tag
        color:
          type:
          - string
          - 'null'
          description: 'Color to render the tag formated as Hex color code. Ex #0000FF'
          example: '#795548'
      required:
      - name
    UserInduction:
      type: object
      required:
      - id
      - induction_id
      - user_id
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
        induction_id:
          type: integer
        active:
          type: boolean
        description:
          type: string
        created_time:
          type: string
          readOnly: true
        issue_date:
          type: string
        expiry_time:
          type: string
        attachment:
          type: string
        induction:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
    UserSkillUpdateCreate:
      type: object
      required:
      - skill_id
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
        skill_id:
          type: integer
        created_time:
          type: string
    UserCompetency:
      type: object
      required:
      - id
      - competency_id
      - user_id
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
        competency_id:
          type: integer
        active:
          type: boolean
        description:
          type: string
        created_time:
          type: string
          readOnly: true
        issue_date:
          type: string
        expiry_time:
          type: string
        attachment:
          type: string
        competency:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
    UserCompetencies:
      type: array
      items:
        $ref: '#/components/schemas/UserCompetency'
    User:
      type: object
      required:
      - user_type_id
      - first_name
      - last_name
      - username
      - suppliers
      - tags
      properties:
        id:
          type: integer
          readOnly: true
        user_type_id:
          type: integer
          example: 2
        employee_id:
          type: string
          example: emp-123
        first_name:
          type: string
          example: Joe
        last_name:
          type: string
          example: Smith
        full_name:
          type: string
          example: Joe Smith
        dob:
          type: string
          example: '1971-01-01'
        address:
          type: string
          example: 1644 Platte St
        address_geo:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                example:
                - 39.757776
                - -105.0071
        tasks:
          type: array
          description: Collection of user tasks
          items:
            type: object
            properties:
              task_id:
                type: string
                description: Task identifier of the task
                example: '97'
              name:
                type: string
                description: Name of the task
                example: 20 Tonne Franna
              external_id:
                type: string
                description: External system identifier of the task
                example: 20tonne x
        suppliers:
          type: array
          description: Collection of suppliers related to the user. Always present, and empty when the user has no related suppliers.
          items:
            type: object
            properties:
              supplier_id:
                type: integer
                description: Identifier of the supplier
                example: 28
              name:
                type: string
                description: Name of the supplier
                example: Acme Labour Hire
              external_id:
                type:
                - string
                - 'null'
                description: External system identifier of the supplier
                example: SUP-28
              active:
                type: boolean
                description: Whether the supplier is active
                example: true
        tags:
          type: array
          description: Collection of tags applied to the user. Always present, and empty when the user has no tags.
          items:
            $ref: '#/components/schemas/TagPart'
          example:
          - tag_id: 17
            name: HEAVY VEHICLES
            description: null
            color: '#009688'
        suburb:
          type: string
          example: Denver
        state:
          type: string
          example: CO
        postcode:
          type: string
          example: 80202
        email:
          type: string
          example: joe.smith@email.com
        contact:
          type: string
          example: 1 333 444 5555
        employment_type:
          type: integer
          example: 1
        emergency_contact:
          type: string
          example: 1 111 333 4444
        emergency_contact_name:
          type: string
          example: Jane Smith
        username:
          type: string
          example: joe.smith@email.com
        active:
          type: boolean
          example: true
        modified_by:
          type: string
          example: auser
        modified_time:
          type: string
          example: '2023-02-27T15:53:34.229Z'
        comments:
          type: string
          example: comments go here
        user_pic:
          type: string
        eula:
          type: integer
          example: 1
        usi:
          type: string
        integration_id:
          type:
          - string
          - 'null'
          example: int_123456
    UserCompetencyUpdateCreate:
      type: object
      required:
      - competency_id
      - user_id
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
        competency_id:
          type: integer
        active:
          type: boolean
        description:
          type: string
        created_time:
          type: string
          readOnly: true
        issue_date:
          type: string
        expiry_time:
          type: string
        attachment:
          type: string
    Users:
      type: array
      items:
        $ref: '#/components/schemas/User'
    UserWithTagId:
      type: object
      required:
      - user_type_id
      - first_name
      - last_name
      - username
      properties:
        id:
          type: integer
          readOnly: true
        user_type_id:
          type: integer
          example: 2
        employee_id:
          type: string
          example: emp-123
        integration_id:
          type: string
          example: string
        first_name:
          type: string
          example: Joe
        last_name:
          type: string
          example: Smith
