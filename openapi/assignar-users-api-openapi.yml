openapi: 3.2.0
info:
  title: Assignar Public Users API
  version: Version 2
  description: The Assignar Public API provides the ability for customers to extend the capability of the Assignar platform.
servers:
- description: Australia/New Zealand
  url: https://api.assignar.com.au/v2
- description: North America/Europe
  url: https://api.assignar.com/v2
security:
- OAuth2:
  - target-entity:b816a5d3-40c3-477f-a551-1d066d7211cc:api_access
tags:
- name: Users
paths:
  /users:
    get:
      summary: List all existing users
      tags:
      - Users
      operationId: getUsers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/Users'
    post:
      summary: Create a new user
      tags:
      - Users
      operationId: newUser
      requestBody:
        $ref: '#/components/requestBodies/CreateUpdateUserRequest'
      security:
      - Assignar Tenant Auth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  data:
                    $ref: '#/components/schemas/UserWithTagId'
              example:
                status: 201
                data:
                  id: 1
                  full_name: Joe Smith
                  user_type_id: 2
                  employee_id: emp-123
                  integration_id: int_123456
                  first_name: Joe
                  last_name: Smith
                  dob: '1971-01-01T00:00:00.000Z'
                  address: 1644 Platte St
                  address_geo:
                    type: point
                    coordinates:
                    - 39.757776, -105.0071
                  suburb: Denver
                  state: CO
                  postcode: 80202
                  email: joe.smith@email.com
                  contact: 1 333 444 5555
                  employment_type: 1
                  emergency_contact: 1 111 333 4444
                  emergency_contact_name: Jane Smith
                  username: joe.smith@email.com
                  active: true
                  comments: comments go here
                  user_pic: null
                  eula: 1
                  usi: null
                  modified_by: auser
                  modified_time: '2021-07-24T22:53:02.693Z'
                  tags:
                  - tag_id: 143
                  tasks:
                  - task_id: 97
                  suppliers:
                  - supplier_id: 28
  /users/{userId}:
    get:
      summary: Retrieve an existing user
      tags:
      - Users
      operationId: getUser
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/User'
    put:
      summary: Update an existing user
      tags:
      - Users
      operationId: updateUser
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
      security:
      - Assignar Tenant Auth: []
      requestBody:
        $ref: '#/components/requestBodies/CreateUpdateUserRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                x-examples:
                  example-1:
                    status: 204
              examples:
                Success:
                  value:
                    status: 204
    delete:
      summary: Delete an existing user
      tags:
      - Users
      operationId: deleteUser
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Success
  /user-types:
    get:
      summary: List all existing user types
      tags:
      - Users
      operationId: getUserTypes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/UserTypes'
  /user-types/{userTypeID}:
    get:
      summary: Retrieve an existing user type
      tags:
      - Users
      operationId: getUserType
      parameters:
      - in: path
        name: userTypeID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/UserType'
  /employment-types:
    get:
      summary: List all existing employment types
      tags:
      - Users
      operationId: getEmploymentTypes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/EmploymentTypes'
    post:
      summary: Create a new employment type
      tags:
      - Users
      operationId: newEmploymentType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmploymentType'
      responses:
        '201':
          description: Created. The created record is returned in `data`. **The fields present depend on the payload supplied** — every field you sent, plus the generated `id`, any column defaults, and audit values such as `modified_by`. A field you did not send is absent rather than null, and related objects are not included. The example below shows one such request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  data:
                    $ref: '#/components/schemas/EmploymentType'
              examples:
                Success:
                  value:
                    status: 201
                    data:
                      id: 29
                      name: Casual - Daily
  /employment-types/{employmentTypeId}:
    get:
      summary: Retrieve an existing employment type
      tags:
      - Users
      operationId: getEmploymentType
      parameters:
      - in: path
        name: employmentTypeId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/EmploymentType'
    put:
      summary: Update an existing employment type
      tags:
      - Users
      operationId: updateEmploymentTypeId
      parameters:
      - in: path
        name: employmentTypeId
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmploymentType'
      responses:
        '204':
          description: Success
    delete:
      summary: Delete an existing employment type
      tags:
      - Users
      operationId: deleteEmploymentType
      parameters:
      - in: path
        name: employmentTypeId
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Success
  /users/{userId}/tags:
    get:
      summary: User Tags
      tags:
      - Users
      operationId: c6ceefb3-3e78-4b7d-8cea-03a459342c46
      responses:
        default:
          description: no response description was provided for this operation
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
          default: '950'
