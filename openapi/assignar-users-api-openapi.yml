                    description: The response status
                  data:
                    $ref: '#/components/schemas/UserSkill'
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
          default: ''
      - name: skillId
        required: true
        in: path
        schema:
          type: string
          default: ''
  /users/{userId}/skills:
    get:
      summary: List all existing user skills for user
      tags:
      - Users
      operationId: getUserSkills
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/UserSkills'
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
          default: ''
    post:
      summary: Create a new user skill
      tags:
      - Users
      operationId: createUserSkill
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
          default: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSkillUpdateCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/UserSkillUpdateCreate'
  /users/{userId}/skills/{id}:
    delete:
      summary: Delete an existing user skill
      tags:
      - Users
      operationId: deleteUserSkill
      responses:
        '204':
          description: Success
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
          default: ''
      - name: id
        required: true
        in: path
        schema:
          type: string
          default: ''
  /users/{userId}/inductions:
    get:
      summary: List all existing user inductions for user
      tags:
