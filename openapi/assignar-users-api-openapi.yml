                type:
                - array
                - 'null'
                description: 'The complete set of suppliers the user should be related to. This replaces the existing links rather than adding to them: send every supplier the user should end up with. An empty array clears all of them. Omitting the field, or sending null, leaves the existing links untouched. Any other value is rejected with a 400 — including `""`, `0` and `false`. Repeated ids are de-duplicated. Every supplier_id must match an existing supplier or the whole request is rejected with a 400 naming the unknown ids; inactive suppliers are accepted.'
