        start_at_tz:
          type:
          - string
          - 'null'
          example: Australia/Sydney
        end_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2024-01-15T17:00:00.000Z'
        end_at_tz:
          type:
          - string
          - 'null'
          example: Australia/Sydney
        start_at_naive:
          type:
          - string
          - 'null'
          example: '2024-01-15T08:00:00'
        end_at_naive:
