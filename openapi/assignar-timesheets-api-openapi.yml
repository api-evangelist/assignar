                example: '2023-05-06T01:00:00.000Z'
                description: start time in UTC
              start_at_tz:
                type: string
                example: Australia/Sydney
                description: start timezone - used to convert `start_at` to local timezone
              end_at:
                type: string
                example: '2023-05-06T02:00:00.000Z'
                description: end time in UTC
              end_at_tz:
                type: string
                example: Australia/Sydney
                description: end timezone - used to convert `end_at` to local timezone
