        client_id:
          type: integer
        user_id:
          type: integer
        project_id:
          type: integer
        task_id:
          type: integer
        location:
          type: string
        order_id:
          type: integer
        supplier_id:
          type: integer
        job_number:
          type: string
        start_time:
          type: string
        start_datetime:
          type: string
        end_time:
          type: string
        end_datetime:
          type: string
        break_time:
          type: string
        travel_time_to:
          type: string
        travel_time_from:
          type: string
        total_time:
          type: string
        comments:
          type: string
        office_use:
          type: string
        submitted_date:
          type: string
        date_of_creation:
          type: string
        created_by_id:
          type: string
        modified_time:
          type: string
        modified_by:
          type: string
        submitted_by:
          type: string
        checked:
          type: boolean
        locked:
          type: boolean
        latitude:
          type: number
        longitude:
          type: number
        latitude2:
          type: number
        longitude2:
          type: number
        signature_name:
          type: string
        signature:
          type: string
        client_signature_name:
          type: string
        completed_by_id:
          type: integer
        completed_at:
          type: string
        is_processed:
          type: boolean
        processed_by_id:
          type: integer
        processed_at:
          type: string
        deleted_time:
          type: string
        integration_id:
          type:
          - string
          - 'null'
        client:
          type: object
          properties:
            name:
              type: string
            external_id:
              type: string
        project:
          type: object
          properties:
            name:
              type: string
            external_id:
              type: string
        task:
          type: object
          properties:
            name:
              type: string
            external_id:
              type: string
        user:
          type: object
          properties:
            full_name:
              type: string
            username:
              type: string
            first_name:
              type: string
            last_name:
              type: string
            employee_id:
              type: string
        digitaldocket:
          type: object
