          - 'null'
        end_at:
          type:
          - string
          - 'null'
          format: date-time
        end_at_tz:
          type:
          - string
          - 'null'
        start_at_naive:
          type:
          - string
          - 'null'
          example: '2024-01-15T09:00:00'
        end_at_naive:
          type:
          - string
          - 'null'
          example: '2024-01-15T10:00:00'
