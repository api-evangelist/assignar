openapi: 3.2.0
info:
  title: Assignar Public Timesheets API
  version: Version 2
  description: The Assignar Public API provides the ability for customers to extend the capability of the Assignar platform.
servers:
- description: Australia/New Zealand
  url: https://api.assignar.com.au/v2
- description: North America/Europe
  url: https://api.assignar.com/v2
security:
- OAuth2:
  - target-entity:b816a5d3-40c3-477f-a551-1d066d7211cc:api_access
tags:
- name: Timesheets
paths:
  /timesheets-expanded:
    get:
      summary: List all timesheets with expanded details
      description: 'Retrieves a list of timesheets with full expanded details including activity entries, asset entries,

        leave request entries, dockets, allowances, and site diary information. This endpoint provides a

        comprehensive view of timesheet data in a single response.'
      tags:
      - Timesheets
      operationId: getTimesheetsExpanded
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/TimesheetsExpandedList'
  /timesheets-expanded/{id}:
    get:
      summary: Retrieve a single timesheet with expanded details
      description: 'Retrieves a single timesheet with full expanded details including activity entries, asset entries,

        leave request entries, dockets, allowances, and site diary information. This endpoint provides a

        comprehensive view of all timesheet-related data in a single response.'
      tags:
      - Timesheets
      operationId: getTimesheetExpanded
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: The unique identifier of the timesheet
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/TimesheetExpanded'
        '404':
          description: Timesheet not found
  /timesheets/coded-worker-times:
    get:
      summary: Retrieve the coded timesheets for workers
      tags:
      - Timesheets
      operationId: getCodedWorkerTimes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/CodedWorkerTimes'
  /timesheets/coded-worker-times/week-status:
    get:
      summary: Retrieve the weekly status for coded timesheets
      tags:
      - Timesheets
      operationId: getCodedTimesheetWeeklyStatus
      parameters:
      - name: start_date
        description: The start date should be the first working day of the week
        required: true
        in: query
        schema:
          type: string
      - name: timezone
        required: false
        in: query
        schema:
          type: string
          default: UTC
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/CodedTimesheetWeeklyStatus'
  /timesheets/{timesheetId}/process:
    put:
      summary: Sets a timesheet's status to processed
      description: In order to mark a timesheet as processed, the timesheet must be completed/submitted and not already processed.
      tags:
      - Timesheets
      operationId: processTimesheet
      parameters:
      - in: path
        name: timesheetId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
        '400':
          description: 'Bad Request

            - Timesheet must be completed before processing

            - Timesheet already processed

            '
        '404':
          description: Timesheet not found
components:
