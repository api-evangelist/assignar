  '/assets/{assetId}/documents':
    get:
      summary: Get a list of documents attached to the asset.
      description: >-
        Returns the documents attached to an asset, each with a signed
        `attachment_url` for downloading the file. Inactive documents are hidden
        by default; pass `active=false` to return those instead. Responds 404 if
        the asset does not exist or has been deleted.
      tags:
        - Assets
      operationId: getAssetDocuments
      parameters:
        - name: assetId
          required: true
          in: path
          schema:
            type: integer
        - name: page
          required: false
          in: query
          schema:
            type: string
        - name: page_size
          required: false
          in: query
          schema:
            type: string
        - name: sort
          required: false
          in: query
          description: 'Sort by any root field, prefixed with `-` to reverse (e.g. `-expiry_date`).'
          schema:
            type: string
        - name: active
          required: false
          in: query
          description: 'Defaults to `true`. Pass `active=false` to return only inactive documents.'
          schema:
            type: boolean
        - name: expiry_date__lte
          required: false
          in: query
          description: 'Return documents expiring on or before this date, e.g. `expiry_date__lte=2025-12-31`.'
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  count:
                    type: integer
                    description: The number of asset documents that satisfies the query.
                  data:
                    $ref: '#/components/schemas/AssetDocuments'
        '404':
          description: The asset does not exist or has been deleted.
    post:
      summary: Attach a document to an asset
      description: >-
        Associates an existing document definition with an asset and records the
        uploaded file against that association. Pick a `document_id` from `GET
        /documents`; this endpoint does not create new document definitions.


        Upload the file first with `POST /upload-urls/asset-document` and pass
        the `path` it returns as `attachment`, exactly as returned — including
        its leading slash. A path that has lost its leading slash produces a
        download URL that does not resolve.
      tags:
        - Assets
      operationId: postAssetDocument
      parameters:
        - name: assetId
          required: true
          in: path
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - document_id
              properties:
                document_id:
                  type: integer
                  description: 'The id of the document definition to attach, from `GET /documents`.'
                attachment:
                  type: string
                  description: 'The `path` returned by `POST /upload-urls/asset-document`, used exactly as returned.'
                label:
                  type: string
                comments:
                  type: string
                active:
                  type: boolean
                disabled:
                  type: boolean
                expiry_date:
                  type: string
                  format: date
                expiry_date_alert:
                  type: string
                  format: date
                expiry_number:
                  type: integer
                expiry_number_alert:
                  type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  data:
                    $ref: '#/components/schemas/AssetDocument'
        '400':
          description: >-
            The payload is missing or invalid, or an id was supplied in the path.
            Ids are assigned by the server.
        '404':
          description: The asset does not exist or has been deleted.
  '/assets/{assetId}/documents/{assetDocumentId}':
    get:
      summary: Retrieve a document attached to the asset.
      description: >-
        A document is scoped to its asset: requesting it under a different
        `assetId` responds 404. Inactive documents are not retrievable by id,
        matching their exclusion from the list.
      tags:
        - Assets
      operationId: getAssetDocument
      parameters:
        - name: assetId
          required: true
          in: path
          schema:
            type: integer
        - name: assetDocumentId
          required: true
          in: path
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/AssetDocument'
        '404':
          description: >-
            No such document on this asset, the document is inactive, or the
            asset has been deleted.
    put:
      summary: Update a document attached to the asset.
      description: >-
        Updates the supplied fields on the association. To replace the file,
        upload a new one with `POST /upload-urls/asset-document` and pass the
        returned `path` as `attachment`.
      tags:
        - Assets
      operationId: putAssetDocument
      parameters:
        - name: assetId
          required: true
          in: path
          schema:
            type: integer
        - name: assetDocumentId
          required: true
          in: path
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                document_id:
                  type: integer
                attachment:
                  type: string
                label:
                  type: string
                comments:
                  type: string
                active:
                  type: boolean
                disabled:
                  type: boolean
                expiry_date:
                  type: string
                  format: date
                expiry_date_alert:
                  type: string
                  format: date
                expiry_number:
                  type: integer
                expiry_number_alert:
                  type: integer
      responses:
        '204':
          description: Success
        '404':
          description: >-
            No such document on this asset, or the asset has been deleted.
    delete:
      summary: Remove a document attached to the asset.
      tags:
