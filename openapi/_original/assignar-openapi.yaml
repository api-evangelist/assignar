        $ref: '#/components/requestBodies/CreateUpdateAssetClassRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
              examples:
                Success:
                  value:
                    status: 204
        '404':
          description: Asset class not found
    delete:
      summary: Delete an existing asset class
      description: >-
        Permanently deletes the asset class — there is no soft delete and no
        `deleted_at` column, so the record cannot be recovered. Assets that
        referenced it are **not** deleted: the `asset_class_id` foreign key is
        `ON DELETE SET NULL`, so each affected asset has its `asset_class_id`
        set to null and its `assetClass` cleared.
      tags:
        - Asset Classes
      operationId: deleteAssetClass
      parameters:
        - in: path
          name: assetClassId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
              examples:
                Success:
                  value:
                    status: 204
        '404':
          description: Asset class not found
      security:
        - Assignar Tenant Auth: []
