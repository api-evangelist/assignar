                emergency_contact_name: Jane Smith
                password: strong_password_here
                active: true
                comments: comments go here
                user_pic: null
                eula: 1
                usi: null
                tags:
                  - tag_id: 143
                tasks:
                  - task_id: 97
                suppliers:
                  - supplier_id: 28
      description: ''
