      operationId: deleteAssetDocument
      parameters:
        - name: assetId
          required: true
          in: path
          schema:
            type: integer
        - name: assetDocumentId
          required: true
          in: path
          schema:
            type: integer
      responses:
        '204':
          description: Success
        '404':
          description: >-
            No such document on this asset, or the asset has been deleted.
  /upload-urls/asset-document:
    post:
      summary: Calculate an S3 signed URL for uploading a file for an Asset Document.
      description: |
        We store file uploads to Amazon S3. Use this endpoint to receive a secure, signed `url` to upload a file to and
        the `path` to that file that you can use in the payload for creating the Asset Document.
      tags:
        - Assets
      operationId: postAssetDocumentUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
