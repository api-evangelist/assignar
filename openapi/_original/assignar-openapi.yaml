                description: The email address associated with the User. If provided, it must be unique within the same User type across all active Users. For "Worker", providing an email grants access to the mobile app; if no email is provided, the worker is created as a resource with no mobile access.
              contact:
                type: string
                example: 1 333 444 5555
              employment_type:
                type: integer
                example: 1
              emergency_contact:
                type: string
                example: 1 111 333 4444
              emergency_contact_name:
                type: string
                example: Jane Smith
              password:
                type: string
                example: strong_password_here
                deprecated: true
                description: \[DEPRECATED\] This field is deprecated and will be removed in future versions.
              active:
                type: boolean
                example: true
              comments:
                type: string
                example: comments go here
              user_pic:
                type: string
              eula:
                type: integer
                example: 1
              usi:
                type: string
              tags:
                type: array
                description: Collection of user tags
                items:
                  type: object
                  properties:
                    tag_id:
                      type: integer
                      description: Tag identifier of the user
                      example: 143
              tasks:
                type: array
                description: Collection of user tasks
                items:
                  type: object
                  properties:
                    task_id:
                      type: integer
                      description: Task identifier of the task
                      example: 97
              suppliers:
                type: array
                nullable: true
                description: >-
                  The complete set of suppliers the user should be related to.
                  This replaces the existing links rather than adding to them:
                  send every supplier the user should end up with. An empty
                  array clears all of them. Omitting the field, or sending
                  null, leaves the existing links untouched. Any other value
                  is rejected with a 400 — including `""`, `0` and `false`.
                  Repeated ids are de-duplicated. Every supplier_id must match
                  an existing supplier or the whole request is rejected with a
                  400 naming the unknown ids; inactive suppliers are accepted.
                items:
                  type: object
                  properties:
                    supplier_id:
                      type: integer
                      description: Identifier of the supplier to relate
                      example: 28
          examples:
            Request:
              value:
                user_type_id: 2
                employee_id: emp-123
                integration_id: int_123456
                first_name: Joe
                last_name: Smith
                dob: '1971-01-01'
                address: 1644 Platte St
                address_geo:
                  { 'type': 'Point', 'coordinates': [39.757776, -105.0071] }
                suburb: Denver
                state: CO
                postcode: 80202
                email: joe.smith@email.com
                contact: 1 333 444 5555
                employment_type: 1
