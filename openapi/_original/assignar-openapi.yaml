                    description: The response status
                  data:
                    $ref: '#/components/schemas/Activities'
    post:
      summary: Create a new activity
      tags:
        - Activities
      operationId: newActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activity'
      responses:
        '201':
          description: >-
            Created. The created record is returned in `data`. **The fields present depend on
            the payload supplied** — every field you sent, plus the generated `id`, any column
            defaults, and audit values such as `modified_by`. A field you did not send is absent
            rather than null, and related objects are not included. The example below shows one
            such request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  data:
                    $ref: '#/components/schemas/Activity'
              examples:
                Success:
                  value:
                    status: 201
                    data:
