    Skills:
      type: array
      items:
        $ref: '#/components/schemas/Skill'
    Skill:
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        subskill:
          type: object
          readOnly: true
          nullable: true
          description: |-
            A skill that this skill also covers. A worker holding this skill is treated as holding the sub-skill too, so a search for the sub-skill also returns holders of this one — the sub-skill of a truck licence could be a car licence, so a search for a car licence returns truck-licence holders.

            The relationship is transitive: truck → car → moped means a moped requirement matches a truck-licence holder.

            A skill has at most one sub-skill. Always present — `null` when the skill has none, and returned even when `?fields=` does not ask for it.

            This field is read-only. To set or remove a sub-skill, send `subskill_id` on a create or update; the two are different fields, so echoing a response back into a write sends no `subskill_id` and leaves the sub-skill alone.
          properties:
            id:
              type: integer
              example: 123
            name:
              type: string
              example: Rigger Intermediate
    SkillUpdate:
      type: object
      description: |-
        Every field is optional — send only what you want to change, and anything omitted is left as it is. A skill can be renamed without touching its sub-skill, and its sub-skill can be set or removed without renaming it.

        The body itself must not be empty: `{}` is rejected with `[400] Missing payload.`
      properties:
        name:
          type: string
        subskill_id:
          type: integer
          nullable: true
          description: |-
            Sets or removes this skill's sub-skill: a skill that this skill also covers, so a worker holding this skill is treated as holding the sub-skill too. The relationship is transitive, and a skill has at most one sub-skill. Responses return it as `subskill`, an object.

            | Payload | Effect |
            | --- | --- |
            | key omitted | existing sub-skill untouched |
            | `null` | sub-skill removed |
            | a positive integer | sub-skill set, replacing any existing one |

            Setting one replaces the existing sub-skill rather than adding to it, since a skill has at most one.

            Accepts an integer or a digit-only string (`123` and `"123"` both work), but loose numeric forms are rejected rather than coerced — `"1e1"`, `"0x3"`, `" 123 "`, `"+5"` and `"123.0"` are all `400`. `-1` is not a removal sentinel on this API and is rejected; use `null`.
          example: 123
    SkillCreate:
      description: |-
        The same body as an update, except that `name` is required.
      allOf:
        - $ref: '#/components/schemas/SkillUpdate'
        - type: object
          required:
