              properties:
                filename:
                  type: string
                  description: The filename of the file you wish to upload.
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: url
                    description: 'To upload the file, use PUT with this URL.'
                  path:
                    type: string
                    description: >-
                      Use this value as `attachment` in the payload when creating an
                      Asset Document. Pass it through exactly as returned, including
                      the leading slash.
