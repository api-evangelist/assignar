        - Skills & Competencies
      operationId: getSkills
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The response status
                  data:
                    $ref: '#/components/schemas/Skills'
              examples:
                Success:
                  value:
                    status: 200
                    data:
                      - id: 122
                        name: Rigger Advanced
                        subskill:
                          id: 123
                          name: Rigger Intermediate
                      - id: 124
                        name: Rigger Basic
                        subskill: null
                    count: 2
    post:
      summary: Create a new skill
      tags:
        - Skills & Competencies
      operationId: newSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCreate'
      responses:
        '201':
          description: >-
            Created. The created record is returned in `data`. **The fields present depend on
            the payload supplied** — every field you sent, plus the generated `id`, any column
            defaults, and audit values such as `modified_by`. A field you did not send is absent
            rather than null. The example below shows one such request.


            `subskill` is the exception on this endpoint: it is always returned — as an object
            when the request set a `subskill_id`, and `null` when it did not.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  data:
                    $ref: '#/components/schemas/Skill'
              examples:
                Success:
                  value:
                    status: 201
                    data:
                      id: 231
                      name: Rigger Advanced
                      subskill: null
                Success (with a sub-skill):
                  value:
                    status: 201
                    data:
                      id: 232
                      name: Rigger Advanced
                      subskill:
                        id: 123
                        name: Rigger Intermediate
        '400':
          description: >-
            Could not process payload. Raised when `name` is already taken — skill names are
            unique per tenant — and by `subskill_id` when the skill it names does not exist,
            when it is the skill being created, when the edge would create a cycle, or when the
            value is malformed. See `subskill_id` on the request body for the accepted forms.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Response message
              examples:
                Duplicate name:
                  value:
                    message: '[400] Unique Constraint Error - name'
                Unknown sub-skill:
                  value:
                    message: >-
                      [400] Unknown subskill_id: 987654. The skill must exist before it can be
                      set as a sub-skill.
                Own sub-skill:
                  value:
                    message: '[400] A skill cannot be its own sub-skill.'
                Cycle:
                  value:
                    message: >-
                      [400] Setting skill 123 as a sub-skill of skill 122 would create a cycle:
                      skill 122 is already reachable from skill 123.
                Malformed:
                  value:
                    message: >-
                      [400] subskill_id must be a positive integer, or null to remove the
                      sub-skill.
