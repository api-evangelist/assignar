      description: |
        The `id` value returned in the response can be used as the `userId` parameter in `GET /projects/{projectID}`.
      operationId: getProjectId
      parameters:
        projectId: $response.body#/data/0/id
  requestBodies:
    CreateOrderTask:
      content:
        application/json:
          schema:
            type: object
            x-examples:
              example-1:
                task_id: 0
                task_quantity: 0
                dates:
                  - string
                start_time: string
                end_time: string
                description: string
            properties:
              task_id:
                type: integer
              task_quantity:
                type: integer
                description: The number of resources that need to be scheduled.
              dates:
                type: array
                description: 'Used when the Order is a Wet Hire/Labor Hire. An array of strings, with the format "YYYY-MM-DD". All dates in the array must be greater than or equal to the Order Start Date or less than or equal to the Order End Date. If dates is empty or not provided, the Order Start Date and Order End Date are used to create the Order Task Shift Dates. '
                items:
                  type: string
              start_time:
                type: string
                description: 'Formated in 24 hr as "00:00". If the value is not provided it will use the values configured in "Default start and end time for order tasks" setting found in the web application at Settigs > View/Edit Settings. If there is no default configured, "07:00" will be used.'
              end_time:
                type: string
                description: 'Formated in 24 hr as "00:00". If the value is not provided it will use the values configured in "Default start and end time for order tasks" setting found in the web application at Settigs > View/Edit Settings. If there is no default configured, "17:00" will be used.'
              description:
                type: string
            required:
              - task_id
              - task_quantity
          examples:
            Example:
              value:
                task_id: 100
                task_quantity: 1
                dates:
                  - 2022/09/24
                  - 2022/09/25
                  - 2022/09/26
                start_time: '07:00'
                end_time: '17:00'
                description: This is an example order task.
    CreateUpdateAssetClassRequest:
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: >-
                  Name of the asset class. Not unique — two asset classes may
                  share a name.
                maxLength: 100
                example: Heavy Machinery
              description:
                type: string
                description: Description of the asset class
                maxLength: 255
                example: Large construction equipment
                nullable: true
              code:
                type: string
                description: >-
                  Short code for the asset class. Unique across asset classes —
                  reusing an existing code is rejected with
                  `[400] Unique Constraint Error - unique_asset_class_code`.
                  May be omitted or null, and any number of asset classes may
                  have no code.
                maxLength: 50
                example: HEAVY-MACH
                nullable: true
            required:
              - name
          examples:
            Request:
              value:
                name: Heavy Machinery
                description: Large construction equipment
                code: HEAVY-MACH
      description: ''
    CreateUpdateAssetRequest:
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Name of the asset
                example: Medium Dozer 05
              description:
                type: string
                description: Description of the asset
                example: Cat C9.3B 215 Net HP @ 50733
              rego_number:
                type: string
                description: The alpha-numberic id on the asset's number or license plate
                example: UVO 936
              active:
                type: boolean
                default: false
                description: Active or archived state of asset
              year:
                type: string
                description: Production year of the asset
                example: '2021'
              make:
                type: string
                description: Manufacturer or brand of the asset
                example: Cat
              model:
                type: string
                description: Model of the asset
                example: D6
              serial_number:
                type: string
                description: Serial number of the asset
                example: US09U012345
              charge_rate:
                type: integer
                description: charge rate of the asset
                example: 120
              number_reading:
                type: integer
                description: Odometer or hour meter reading of the asset
                example: 1264
              external_id:
                type: string
                description: External system identifier of the asset
                example: 07237c3e-f003-4092-8b2d-180f39fc3d45
              integration_id:
                type: string
                description: Integration identifier of the asset
                example: "int_123456"
                nullable: true
              asset_class_id:
                type: integer
                description: >-
                  Identifier of the asset class to assign to the asset. Must
                  reference an existing asset class — an unknown id is
                  rejected with `[400] Foreign Key Constraint Error`. Send
                  null to clear the asset's class.
                example: 5
                nullable: true
              tags:
                type: array
                description: Collection of tags of the asset
                items:
                  type: object
                  properties:
                    tag_id:
                      type: integer
                      description: Tag identifier of the asset
                      example: 301
              attachments:
                type: array
                description: |-
                  Replaces the asset's attachment links rather than adding to them: the array you send becomes the complete set, so any attachment missing from it is unlinked — including links added in the Assignar dashboard. Read the asset first and send the full set back if you only mean to add one.

                  Link by `attachment_id`. Get those ids from `/asset-attachments`, filtering by your own key with `?external_id=`.

                  | Payload | Effect |
                  | --- | --- |
                  | key omitted | existing links untouched |
                  | `null` | existing links untouched |
                  | `[]` | every link removed |
                  | a non-empty array | links become exactly that set |

                  Repeated ids are de-duplicated silently, so `[{2},{2}]` links attachment 2 once. `attachment_id` accepts an integer or a digit-only string (`2` and `"2"` both work), but loose numeric forms are rejected rather than coerced — `"1e1"`, `"0x3"` and `" 2 "` are all `400`. At most 500 entries per request.

                  A rejected `attachments` payload writes nothing at all: the whole request is validated before any write, so `tags` sent alongside it are not applied either.
                nullable: true
                maxItems: 500
                items:
                  type: object
                  required:
                    - attachment_id
                  properties:
                    attachment_id:
                      type: integer
                      description: >-
                        Identifier of an existing asset attachment. Unknown ids
                        are rejected with `[400] Unknown attachment_id: <ids>.
                        Attachments must exist before they can be linked to an
                        asset.` — the message names the first 10 and summarises
                        the rest.
                      example: 2
            required:
              - name
          examples:
            Request:
              value:
                name: Medium Dozer 05
                description: Cat C9.3B 215 Net HP @ 50733
                rego_number: UVO 936
                active: false
                year: '2021'
                make: Cat
                model: D6
                serial_number: US09U012345
                charge_rate: 120
                number_reading: 1264
                external_id: 07237c3e-f003-4092-8b2d-180f39fc3d45
                integration_id: int_123456
                asset_class_id: 5
                attachments:
                  - attachment_id: 2
                  - attachment_id: 5
                tags:
                  - tag_id: 301
      description: ''
    CreateUpdateUserRequest:
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: integer
                readOnly: true
              user_type_id:
                type: integer
                example: 2
              employee_id:
                type: string
                example: emp-123
              integration_id:
