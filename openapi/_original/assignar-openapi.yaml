info:
  title: Assignar Public API
  version: Version 2
  description: "The Assignar Public API provides the ability for customers to extend the capability of the Assignar platform.\n\n
  ## Authentication\nFor access to Assignar Public V2, ensure all requests carry a bearer token in the authorization header. Obtain this token by authenticating through the Authentication API.\n\n
  Currently, there are two ways of performing an authentication:\n\n
  ### Client Credential Authentication\n\n
  Login API URL with HTTP Method __POST__\n
  ```\nhttps://login.assignar.com/oauth2/token\n```\n\n#### Request Header\n```\nContent-Type: application/x-www-form-urlencoded\nAuthorization: \"Basic YOUR_CLIENT_ID:YOUR_CLIENT_SECRET\"\n```\n
  __Note:__ \n
  - The __CLIENT_ID:CLIENT_SECRET__ is base64 encoded.\n
  - Your __Client ID__ and __Client Secret__ are located in the Assignar dashboard in the Settings - API Access menu. Please contact support, if you are unable to access.\n
  - If you havent configured your __Client ID__ and __Client Secret__ yet, you can set them up in the same access menu.\n\n\n
  #### Scope\n```\ntarget-entity:b816a5d3-40c3-477f-a551-1d066d7211cc:api_access\n```\n
  __Note:__ \n
  - Copy and use the scope value exactly as listed above when requesting an access token via the authentication api.\n\n
  #### Form URL Encoded Variables\n\n```\ngrant_type=client_credentials \nscope=target-entity:b816a5d3-40c3-477f-a551-1d066d7211cc:api_access\n```\n
  __Note:__ \n
  - Use the __client_credentials__ grant to obtain an __access_token__. The __scope__ will undergo validation against granted permissions. Successful validation of all requested permissions will result in a successful grant and the issuance of an __access_token__. \n
  - The __access_token__ will expire in 1 hour. \n\n
  #### Request Example\n
  ```\n
  POST /oauth2/token HTTP/1.1 \n
  Host: login.assignar.com \n
  Authorization: Basic <base64_encoded_client_id_and_secret> \n
  Content-Type: application/x-www-form-urlencoded \n\n
  grant_type=client_credentials&scope=target-entity%3Ab816a5d3-40c3-477f-a551-1d066d7211cc%3Aapi_access \n
  ```\n\n
  ## Request Headers\n
  The following HTTP headers should be included in all requests to the API.\n
  ```\nContent-Type: application/json\nAuthorization: Bearer <access_token>\n```\nThe access_token is a json web token (JWT) and can be obtained using the Authentication API.\n\n
  ## Pagination\nThe API supports pagination using __page__ and __page_size__ parameters in the querystring. The following request will skip the first 100 records and return the second 100 records.\n
  ```\n.../resource?page=2&page_size=100\n```\n
  If using pagination, you should also include a sort in the request to ensure consistent ordering of the results.\n\n\n
  ## Sorting\nTo sort the results according to a specific field, use __sort__ parameter in the querystring. \n\n
  - Any field in the top-level resource can be used for sorting. \n
  - Separate multiple fields with a comma (,).\n
  - Sort order is __ascending__ by default. \n
  - To sort in __descending__ order, prefix the field name with a hyphen (-). \n\n
  The following request will sort the results by active in descending order then by company_name in ascending order.\n
  ```\n .../resource?sort=-active,company_name\n ``` \n \n
  ## Selecting Fields\n To include only specific fields, use __fields__ parameter in the querystring.\n
  - Any field in the top-level resource can be used for selection.\n
  - Separate multiple fields with a comma (,).\n
  ```\n .../resource?fields=id,company_name\n ```\n \n
  ## Filtering\n
  To filter results based on a fields value, include the field with filter value in the querystring.\n
  - Any field in the top-level resource can be used for filtering.\n
  - Separate multiple filter fields with an ampersand (&)\n The following request will filter the results to include only active resources with a company_name as Assignar.\n \n
  ```\n .../resource?active=true&company_name=Assignar\n ```\n \n
  ## Advanced Filtering\n
  <details>\n
  <summary>Click to view advanced filtering operators</summary>\n \n
  For advanced filtering the following operators can be used:\n \n
  | Operator | Description | Category | Example |\n
  |----------|-------------|----------|----------|\n
  | `gt` | Greater than | Comparison | `age__gt=25` |\n
  | `gte` | Greater than or equal to | Comparison | `salary__gte=50000` |\n
  | `lt` | Less than | Comparison | `price__lt=100` |\n
  | `lte` | Less than or equal to | Comparison | `score__lte=80` |\n
  | `ne` | Not equal to | Equality | `status__ne=inactive` |\n
  | `is` | Is equal to | Equality | `active__is=true` |\n
  | `not` | Is not equal to | Equality | `category__not=archived` |\n
  | `in` | Is in the list | List | `role__in=admin,manager,user` |\n
  | `not_in` | Is not in the list | List | `department__not_in=hr,legal` |\n
  | `substring` | Contains the value | String | `name__substring=john` |\n
  | `starts_with` | Starts with the value | String | `email__starts_with=admin` |\n
  | `ends_with` | Ends with the value | String | `domain__ends_with=.com` |\n
  | `between` | Between the values | Range | `date__between=2023-01-01,2023-12-31` |\n
  | `not_between` | Not between the values | Range | `age__not_between=18,65` |\n
  | `col` | Equals the value of another field | Field Comparison | `start_date__col=end_date` |\n
  | `ne_col` | Does not equal the value of another field | Field Comparison | `created_by__ne_col=modified_by` |\n
  | `gt_col` | Greater than the value of another field | Field Comparison | `end_date__gt_col=start_date` |\n
  | `lt_col` | Less than the value of another field | Field Comparison | `min_price__lt_col=max_price` |\n
  | `gte_col` | Greater than or equal to the value of another field | Field Comparison | `budget__gte_col=spent_amount` |\n
  | `lte_col` | Less than or equal to the value of another field | Field Comparison | `used_storage__lte_col=total_storage` |\n \n
  </details>\n \n"
