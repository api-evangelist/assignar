      items:
        $ref: '#/components/schemas/AssetClassDetail'
    AssetClassDetail:
      description: >-
        An asset class as returned by the `/asset-classes` collection. Extends
        the `AssetClass` summary — the four fields the `assetClass` relation
        selects when embedded in an asset or a site diary entry — with the
        audit columns and their hydrated user objects.
      allOf:
        - $ref: '#/components/schemas/AssetClass'
        - type: object
          properties:
            created_at:
              type: string
              format: date-time
              description: System managed. Defaults to the time of creation.
              example: '2024-03-11T02:41:18.000Z'
              readOnly: true
            created_by_id:
              type: integer
              description: >-
                Identifier of the user who created the asset class. Not set by
                `POST /asset-classes` — the public API does not stamp it — so
                it is null for classes created through this API.
              example: 500
              nullable: true
              readOnly: true
            modified_at:
              type: string
              format: date-time
              description: >-
                System managed. Updated by the database on every write, and
                null until the asset class is first updated.
              example: '2024-06-02T22:07:55.000Z'
              nullable: true
              readOnly: true
            modified_by_id:
              type: integer
              description: >-
                Identifier of the user who last modified the asset class. Not
                set by `PUT /asset-classes/{assetClassId}` — the public API
                does not stamp it.
              example: 500
              nullable: true
              readOnly: true
            createdBy:
              allOf:
                - $ref: '#/components/schemas/UserReference'
              description: >-
                The user named by `created_by_id`, hydrated by default with no
                `relations` query parameter. When `created_by_id` is null the
                object is still present with every field set to null, rather
                than the object itself being null.
              readOnly: true
            modifiedBy:
              allOf:
                - $ref: '#/components/schemas/UserReference'
              description: >-
                The user named by `modified_by_id`, hydrated by default with no
                `relations` query parameter. When `modified_by_id` is null the
                object is still present with every field set to null, rather
                than the object itself being null.
              readOnly: true
