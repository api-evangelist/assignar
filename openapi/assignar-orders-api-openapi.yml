  requestBodies:
    CreateOrderTask:
      content:
        application/json:
          schema:
            type: object
            x-examples:
              example-1:
                task_id: 0
                task_quantity: 0
                dates:
                - string
                start_time: string
                end_time: string
                description: string
            properties:
              task_id:
                type: integer
              task_quantity:
                type: integer
                description: The number of resources that need to be scheduled.
              dates:
                type: array
                description: 'Used when the Order is a Wet Hire/Labor Hire. An array of strings, with the format "YYYY-MM-DD". All dates in the array must be greater than or equal to the Order Start Date or less than or equal to the Order End Date. If dates is empty or not provided, the Order Start Date and Order End Date are used to create the Order Task Shift Dates. '
                items:
                  type: string
              start_time:
                type: string
                description: Formated in 24 hr as "00:00". If the value is not provided it will use the values configured in "Default start and end time for order tasks" setting found in the web application at Settigs > View/Edit Settings. If there is no default configured, "07:00" will be used.
              end_time:
                type: string
                description: Formated in 24 hr as "00:00". If the value is not provided it will use the values configured in "Default start and end time for order tasks" setting found in the web application at Settigs > View/Edit Settings. If there is no default configured, "17:00" will be used.
              description:
                type: string
            required:
            - task_id
            - task_quantity
          examples:
            Example:
              value:
                task_id: 100
                task_quantity: 1
                dates:
                - 2022/09/24
                - 2022/09/25
                - 2022/09/26
                start_time: 07:00
                end_time: '17:00'
                description: This is an example order task.
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://login.assignar.com/oauth2/token
          scopes:
            target-entity:b816a5d3-40c3-477f-a551-1d066d7211cc:api_access: Access to API
          description: 'The client credentials flow is a server-to-server flow. There is no user authentication involved in the process. Instead, the client acts on behalf of itself.

            The client can request an access token using only its client credentials (or other supported means of authentication) when the client is requesting access to the protected resources under its control.

            The client credentials are passed in the Authorization header as a Basic Auth (base64 encoded "client_id:client_secret").

            The token endpoint of the Authorization server where the client can obtain the token is https://login.assignar.com/oauth2/token.

            The scope ''target-entity:b816a5d3-40c3-477f-a551-1d066d7211cc:api_access'' is required to access the API.

            '
